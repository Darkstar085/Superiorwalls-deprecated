name: Superiorwalls APK Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  TG_CHAT_ID: "-1001474066247"
  REPO_URL: "https://github.com/Darkstar085/Superiorwalls"

jobs:
  build:
    name: Build & Deliver APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Send build started
        env:
          TG_BOT_KEY: ${{ secrets.TG_BOT_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${TG_BOT_KEY:-}" ]; then
            echo "TG_BOT_KEY secret is not configured."
            exit 1
          fi

          SHORT_SHA="${GITHUB_SHA::8}"

          curl --fail --silent --show-error --retry 3 -X POST "https://api.telegram.org/bot${TG_BOT_KEY}/sendMessage" -d "chat_id=${TG_CHAT_ID}" -d "disable_web_page_preview=true" -d "parse_mode=Markdown" --data-urlencode "text=🤖 Superiorwalls build started — [${SHORT_SHA}](${REPO_URL}/commit/${GITHUB_SHA})"

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "No APK was produced."
            exit 1
          fi

          SHORT_SHA="${GITHUB_SHA::8}"
          APK_NAME="Superiorwalls-${SHORT_SHA}.apk"

          cp "$APK" "$APK_NAME"

          echo "path=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Push APK to Telegram
        env:
          TG_BOT_KEY: ${{ secrets.TG_BOT_KEY }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          APK_NAME: ${{ steps.apk.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --retry 3 -F "document=@${APK_PATH};filename=${APK_NAME}" -F "chat_id=${TG_CHAT_ID}" -F "disable_web_page_preview=true" -F "parse_mode=Markdown" --form-string "caption=📦 Superiorwalls APK — ${GITHUB_SHA::8}" "https://api.telegram.org/bot${TG_BOT_KEY}/sendDocument"

      - name: Send build finished
        if: success()
        env:
          TG_BOT_KEY: ${{ secrets.TG_BOT_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA::8}"

          curl --fail --silent --show-error --retry 3 -X POST "https://api.telegram.org/bot${TG_BOT_KEY}/sendMessage" -d "chat_id=${TG_CHAT_ID}" -d "disable_web_page_preview=true" -d "parse_mode=Markdown" --data-urlencode "text=✅ Superiorwalls build finished — [${SHORT_SHA}](${REPO_URL}/commit/${GITHUB_SHA})"

      - name: Send build failed
        if: failure()
        env:
          TG_BOT_KEY: ${{ secrets.TG_BOT_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA::8}"

          curl --fail --silent --show-error --retry 3 -X POST "https://api.telegram.org/bot${TG_BOT_KEY}/sendMessage" -d "chat_id=${TG_CHAT_ID}" -d "disable_web_page_preview=true" -d "parse_mode=Markdown" --data-urlencode "text=❌ Superiorwalls build failed — [${SHORT_SHA}](${REPO_URL}/commit/${GITHUB_SHA})"